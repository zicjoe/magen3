name: Bug report
description: Report a reproducible problem in Magen3
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, wallet secret keys, database credentials, or relayer secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Connect...\n2. Register...\n3. Submit..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Agent Gateway API
        - Policies
        - Audit Logs
        - Casper integration
        - Database
        - Deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, Node version, operating system, and deployment target.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
