[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magen3-sdk"
version = "0.4.3"
description = "Official Python SDK for the Magen3 Agent Gateway API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Magen3" }]
keywords = ["magen3", "casper", "web3", "ai-agent", "execution-firewall"]

[tool.setuptools.packages.find]
where = ["src"]
